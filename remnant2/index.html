<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Remnant 2 懶人包</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; box-sizing: border-box; }
  body {
    font-family: "Noto Sans TC", system-ui, sans-serif;
    background: #16130f; color: #e8ded0;
    min-height: 100vh; display: grid; place-items: center; padding: 24px;
  }
  .card {
    max-width: 560px; width: 100%;
    background: #201c16; border: 1px solid #3a3226; border-radius: 14px;
    padding: 36px 32px;
  }
  h1 { font-size: 1.5rem; margin-bottom: 6px; color: #f0c060; }
  .sub { color: #a89880; font-size: .9rem; margin-bottom: 24px; }
  .btn {
    display: block; text-align: center; text-decoration: none;
    background: #f0c060; color: #16130f; font-weight: 700;
    padding: 14px; border-radius: 10px; font-size: 1.05rem; margin-bottom: 24px;
  }
  .btn:hover { background: #ffd47e; }
  ol { padding-left: 20px; line-height: 1.9; font-size: .95rem; }
  li code {
    background: #2c261d; padding: 2px 7px; border-radius: 5px;
    font-size: .85em; color: #f0c060;
  }
  .note { margin-top: 20px; padding: 12px 14px; background: #2a1f14; border-left: 3px solid #f0c060;
          border-radius: 6px; font-size: .85rem; color: #c8b8a0; line-height: 1.7; }
</style>
</head>
<body>
  <div class="card">
    <h1>Remnant 2 懶人包</h1>
    <div class="sub">隱藏職業 ×6・精選滿等武器 ×20・飾品 ×30・特性點 +200・廢料 50 萬</div>
    <a class="btn" href="remnant2-bundle.zip">⬇ 下載 remnant2-bundle.zip（87 KB）</a>
    <ol>
      <li>解壓縮到任意資料夾</li>
      <li>把整個資料夾丟給你的 Claude，說：<br><code>照 README_給Claude.md 的步驟幫我安裝這個懶人包</code></li>
      <li>過程中它會請你開關一次遊戲，照做就好</li>
    </ol>
    <div class="note">
      安裝前會自動備份你的存檔，隨時可還原。需要 Windows＋Steam 版遊戲＋.NET 8 SDK（沒有的話 Claude 會幫你裝）。若 Steam 跳出雲端同步衝突，選「本機檔案」。
    </div>
  </div>
</body>
</html>
